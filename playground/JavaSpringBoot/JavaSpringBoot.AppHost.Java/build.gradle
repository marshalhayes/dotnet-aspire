plugins {
    id 'java'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        // Must match the release the Aspire CLI compiles the AppHost with, which is Java 25. The
        // scaffolded AppHost uses an implicitly declared class with an instance main method, finalized
        // in Java 25 by JEP 512 (https://openjdk.org/jeps/512). Targeting anything lower makes the
        // editor report the AppHost's own entry point as a syntax error.
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

sourceSets {
    main {
        java {
            // Two source roots, and both are needed.
            //
            // '.' holds AppHost.java. It sits beside this build file rather than under src/main/java so
            // that its paths to the sibling services stay identical to the C# AppHost's ("../catalog").
            //
            // '.aspire/modules' holds the Aspire Java SDK, which the CLI generates as source laid out by
            // package: .aspire/modules/aspire/AspireBuilder.java declares `package aspire;`. A source root
            // has to be the directory a package path is relative to, so the SDK needs a root of its own;
            // covering it from '.' instead makes `import aspire.*` resolve to nothing, because that root
            // expects those files under ./aspire.
            //
            // Gradle is what makes this expressible. Maven allows a single <sourceDirectory>, and neither
            // build-helper-maven-plugin's add-source goal nor <generatedSourcesDirectory> is honoured by
            // the Maven importer inside the Java language server, so a Maven AppHost laid out this way
            // opens with unresolved Aspire imports.
            srcDirs = ['.', '.aspire/modules']

            // Eclipse, and so the Java language server, and so VS Code, refuses to build a project whose
            // source folders nest without an explicit exclusion. '.aspire/modules' nests inside '.', so
            // exclude it from that root; the excludes are relative to each source root, which is why this
            // does not also exclude the SDK from its own root.
            exclude 'src/**', 'build/**', 'bin/**', '.gradle/**', '.aspire/**'
        }
    }
}

// The AppHost's only dependency is the Aspire SDK above, which is generated as source rather than
// resolved as an artifact. Real AppHosts add third-party dependencies here, which is the main reason to
// adopt a build tool: the CLI stages whatever is declared onto the AppHost's classpath before compiling.
dependencies {
}
