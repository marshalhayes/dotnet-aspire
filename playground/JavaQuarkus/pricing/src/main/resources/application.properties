# quarkus-opentelemetry reads its own quarkus.otel.* configuration rather than the standard OTEL_*
# environment variables. AddQuarkusApp mirrors the values Aspire resolves onto the QUARKUS_OTEL_*
# environment variables that SmallRye Config maps to those properties, so no exporter configuration
# belongs in this file. See inventory/src/main/resources/application.properties.
quarkus.otel.enabled=true
