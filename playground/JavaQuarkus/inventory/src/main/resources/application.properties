# WithReference(pricing) in the AppHost projects the resolved endpoint as the environment variable
# services__pricing__http__0. SmallRye Config matches an environment variable to a property name
# ignoring case and punctuation, so the Aspire name resolves here as written. The default keeps the
# service runnable with `mvnw quarkus:dev` outside the AppHost.
quarkus.rest-client.pricing-api.url=${services__pricing__http__0:http://localhost:8081}

# The exporter endpoint, headers and service name come from the QUARKUS_OTEL_* environment variables
# AddQuarkusApp sets from the values Aspire resolved. quarkus-opentelemetry does not read the standard
# OTEL_* names, so without that mirroring it would keep exporting to its localhost:4317 default. No Java
# agent is involved: the extension is compiled into the application, which is why AddQuarkusApp needs no
# WithOtelAgent call.
quarkus.otel.enabled=true
